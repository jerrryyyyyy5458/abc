<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — CompareX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css?v=canvas2">
  <link rel="stylesheet" href="../../css/global.css?v=canvas2">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/category-nav.css?v=canvas2">
  <link rel="stylesheet" href="../../css/category-browse.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <!-- Categories navigation -->
  <header class="navbar is-scrolled">
    <a class="brand" href="../../"><span class="brand-mark">×</span>Compare<span>X</span></a>
    <nav class="desktop-nav">
      <a href="../../">Discover</a>
      <a class="active" href="./">Categories</a>
      <a href="../stores/">Stores</a>
      <a href="../brands/">Brands</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme">☼</button>
    </div>
  </header>

  <!-- Horizontal category strip -->
  <nav class="category-nav" aria-label="Shop by category" data-category-nav>
    <div class="category-nav-inner">
      <div class="category-nav-track" role="tablist" aria-label="Categories" data-category-track>
        <button class="category-nav-item is-active" type="button" role="tab" aria-selected="true" data-category="electronics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h1v-5H4Zm16 0h-1v5h1a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2Z"/><path d="M8 19v1a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-1"/></svg>
          <span>Electronics</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="beauty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h3l1 5H8l1-5Z"/><path d="M8 8h6v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8Z"/><path d="M9 12v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-7"/><path d="M16.5 4.5 18 8l-1.5 1.5"/><path d="M18 8h2.5a1.5 1.5 0 0 1 0 3H18"/></svg>
          <span>Beauty</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="fashion">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 6 4H3l3 6v10h12V10l3-6h-3l-2 3"/><path d="M8 7c1.2 1.3 2.5 2 4 2s2.8-.7 4-2"/></svg>
          <span>Fashion</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6"/><path d="M12 3v6"/><path d="M8 9h8l1 4H7l1-4Z"/><path d="M7 13h10v2a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4v-2Z"/></svg>
          <span>Home</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="appliances">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M12 10.5v0"/><path d="M9 6h6"/></svg>
          <span>Appliances</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="sports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9Z"/><path d="M3.5 9.5h17M3.5 14.5h17"/></svg>
          <span>Sports</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="books">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 4.8 7.5 4 5 4v14c2.5 0 5 .8 7 2.5 2-1.7 4.5-2.5 7-2.5V4c-2.5 0-5 .8-7 2.5Z"/><path d="M12 6.5v14"/></svg>
          <span>Books</span>
        </button>
        <button class="category-nav-item" type="button" role="tab" aria-selected="false" tabindex="-1" data-category="more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          <span>More</span>
        </button>
        <span class="category-nav-indicator" data-category-indicator aria-hidden="true"></span>
      </div>
    </div>
  </nav>

  <main class="section-wrap category-browse">
    <section class="category-panel is-active" data-category-panel="electronics" role="tabpanel" aria-label="Electronics">
      <div data-category-browse="electronics"></div>
    </section>

    <section class="category-panel" data-category-panel="beauty" role="tabpanel" aria-label="Beauty">
      <div data-category-browse="beauty"></div>
    </section>

    <section class="category-panel" data-category-panel="fashion" role="tabpanel" aria-label="Fashion">
      <div data-category-browse="fashion"></div>
    </section>

    <section class="category-panel" data-category-panel="home" role="tabpanel" aria-label="Home">
      <div data-category-browse="home"></div>
    </section>

    <section class="category-panel" data-category-panel="appliances" role="tabpanel" aria-label="Appliances">
      <div data-category-browse="appliances"></div>
    </section>

    <section class="category-panel" data-category-panel="sports" role="tabpanel" aria-label="Sports">
      <div data-category-browse="sports"></div>
    </section>

    <section class="category-panel" data-category-panel="books" role="tabpanel" aria-label="Books">
      <div data-category-browse="books"></div>
    </section>

    <section class="category-panel" data-category-panel="more" role="tabpanel" aria-label="More">
      <div class="category-placeholder">
        <p class="eyebrow">More</p>
        <h1>More Section</h1>
        <div class="category-placeholder-rule" aria-hidden="true"></div>
        <p>Coming Soon</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeTheme } from "../../js/theme.js";
    import { initializeCategoryNav } from "../../js/category-nav.js";
    import { initializeCategoryBrowse } from "../../js/category-browse.js";
    initializeTheme();
    initializeCategoryNav();
    initializeCategoryBrowse();
  </script>
</body>
</html>
